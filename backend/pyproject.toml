[project]
name = "antarctic-weather-platform"
version = "0.1.0"
description = "Historical Antarctic meteorological data API backed by AEMET OpenData"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    # Starlette's TestClient prefers httpx2 over plain httpx; this is a
    # test-only dependency and does not affect the real AEMET client,
    # which stays on httpx per the project's chosen HTTP client.
    "httpx2>=2.12",
    "mypy>=1.13",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query(...)/Depends(...) as a parameter default is the
# framework's documented idiom for declaring query-parameter metadata and
# dependencies; FastAPI inspects these calls at import time rather than
# reusing one evaluated instance across requests, so B008's usual concern
# (a mutable default silently shared across calls) does not apply.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# test_domain_time.py deliberately constructs naive datetimes: they are
# the documented input contract of to_utc_instant, which pairs a naive
# wall-clock value with an explicit tz argument rather than accepting an
# already-aware datetime. DTZ001 is a real guard against naive datetimes
# elsewhere in the codebase and stays active there.
"tests/unit/test_domain_time.py" = ["DTZ001"]
# ObservationQuery.start/end are the one place a naive datetime is the
# documented input contract: a wall-clock value not yet paired with a
# timezone (see app/domain/time.py's to_utc_instant, applied later in
# the route). DTZ007 stays active everywhere else.
"app/api/schemas.py" = ["DTZ007"]
